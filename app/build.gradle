plugins {
    id 'com.android.application' version '8.9.2'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.21'
}

android {
    namespace 'app.voyahmusic.shared'
    compileSdk 35
    buildFeatures { compose = true }

    defaultConfig {
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    flavorDimensions += 'edition'
    productFlavors {
        player {
            dimension 'edition'
            applicationId 'app.voyahmusic.player'
        }
        transfer {
            dimension 'edition'
            applicationId 'app.voyahmusic.transfer'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (providers.environmentVariable('VOYAH_MUSIC_KEYSTORE').isPresent()) {
        signingConfigs {
            localRelease {
                storeFile rootProject.file(providers.environmentVariable('VOYAH_MUSIC_KEYSTORE').get())
                storePassword providers.environmentVariable('VOYAH_MUSIC_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('VOYAH_MUSIC_KEY_ALIAS').getOrElse('voyah-music')
                keyPassword providers.environmentVariable('VOYAH_MUSIC_KEY_PASSWORD').getOrElse(storePassword)
            }
        }
        buildTypes.release.signingConfig signingConfigs.localRelease
    }
}

kotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.google.zxing:core:3.5.4'
    playerImplementation 'androidx.media3:media3-exoplayer:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}
