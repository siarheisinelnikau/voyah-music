plugins {
    id 'com.android.application'
}

android {
    namespace 'app.voyahmusic.player'
    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'vehicle'
    productFlavors {
        voyah {
            dimension 'vehicle'
            buildConfigField 'boolean', 'MAZDA_EZ6', 'false'
        }
        mazdaEz6 {
            dimension 'vehicle'
            applicationId 'app.mazdaez6music.player'
            buildConfigField 'boolean', 'MAZDA_EZ6', 'true'
            buildConfigField 'String', 'RELEASE_ASSET', '"MazdaEZ6Music"'
        }
    }

    defaultConfig {
        applicationId 'app.voyahmusic.player'
        buildConfigField 'String', 'RELEASE_ASSET', '"VoyahMusic"'
    }
}

dependencies {
    implementation project(':shared')
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0'
    }
}
